<!doctype html>
<html lang="en">
  <body style="margin:0;background:#f5f5f5;font-family:Arial,sans-serif;color:#111111">
    <div style="max-width:520px;margin:40px auto;background:#ffffff;border:1px solid #e5e5e5;border-radius:12px;padding:32px">
      <p style="margin:0 0 24px;font-size:13px;font-weight:700;letter-spacing:.12em;color:#68B32F">Ads Hunting</p>
      <h1 style="margin:0;font-size:26px;line-height:1.2">Your login code</h1>
      <p style="margin:14px 0 24px;color:#666666;line-height:1.6">Enter this one-time code on the Ads Hunting login screen:</p>
      <div style="border-radius:10px;background:#f7f7f7;padding:20px;text-align:center;font-family:monospace;font-size:32px;font-weight:700;letter-spacing:.22em">{{ .Token }}</div>
      <p style="margin:24px 0 0;color:#888888;font-size:12px;line-height:1.6">This code expires shortly and can only be used once. If you did not request it, you can ignore this email.</p>
    </div>
  </body>
</html>
